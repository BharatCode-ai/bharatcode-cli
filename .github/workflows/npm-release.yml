name: Publish first-class BharatCode CLI cohort

on:
  workflow_dispatch:
    inputs:
      controller_sha:
        description: Exact reviewed bharatcode-cli main SHA containing this controller
        required: true
        type: string
      desktop_source_sha:
        description: Exact reviewed BharatCode Desktop 1.15.28 source SHA
        required: true
        type: string
      desktop_run_id:
        description: Exact Desktop producer workflow run ID
        required: true
        type: string
      desktop_run_attempt:
        description: Exact Desktop producer workflow run attempt
        required: true
        default: "1"
        type: string
      cohort_sha256:
        description: Exact SHA-256 of the signed Desktop cohort manifest
        required: true
        type: string
      release_tag:
        description: Exact finalized Desktop release tag
        required: true
        default: desktop-beta-1.15.28
        type: string

permissions:
  contents: read

env:
  CLI_VERSION: 1.15.28
  CONTROLLER_SHA: ${{ inputs.controller_sha }}
  PACKAGE_PROVENANCE_RUN_ATTEMPT: ${{ github.run_attempt }}
  PACKAGE_PROVENANCE_RUN_ID: ${{ github.run_id }}
  PACKAGE_PROVENANCE_SHA: ${{ github.sha }}
  DESKTOP_REPOSITORY: BharatCode-ai/bharatcode-desktop
  DESKTOP_RUN_ATTEMPT: ${{ inputs.desktop_run_attempt }}
  DESKTOP_RUN_ID: ${{ inputs.desktop_run_id }}
  DESKTOP_SOURCE_SHA: ${{ inputs.desktop_source_sha }}
  DESKTOP_WORKFLOW: .github/workflows/bharatcode-next-beta-candidate.yml
  EXPECTED_COHORT_SHA256: ${{ inputs.cohort_sha256 }}
  RELEASE_TAG: desktop-beta-1.15.28

jobs:
  publish-next:
    name: Verify cohort and publish platform packages before meta
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: npm-next
    outputs:
      receipt_sha256: ${{ steps.receipt.outputs.sha256 }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out exact controller
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.controller_sha }}

      - name: Set up Node.js and npm provenance
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: Admit exact controller and Desktop release identity
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          [[ "$CONTROLLER_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PACKAGE_PROVENANCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PACKAGE_PROVENANCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$PACKAGE_PROVENANCE_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$DESKTOP_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$DESKTOP_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$DESKTOP_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$EXPECTED_COHORT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EVENT_NAME" == "workflow_dispatch" ]]
          [[ "$RUN_ATTEMPT" == "1" ]]
          [[ "$INPUT_RELEASE_TAG" == "$RELEASE_TAG" ]]
          [[ "$EVENT_SHA" == "$CONTROLLER_SHA" ]]
          [[ "$GITHUB_SHA" == "$CONTROLLER_SHA" ]]
          [[ "$(git rev-parse HEAD)" == "$CONTROLLER_SHA" ]]
          git merge-base --is-ancestor "$PACKAGE_PROVENANCE_SHA" "$CONTROLLER_SHA"
          [[ "$(git ls-remote origin refs/heads/main | cut -f1)" == "$CONTROLLER_SHA" ]]
          [[ -z "$(git status --porcelain)" ]]
          gh release view "$RELEASE_TAG" --repo "$DESKTOP_REPOSITORY" --json tagName,targetCommitish,isDraft,isPrerelease,assets > release-state.json
          gh api "repos/$DESKTOP_REPOSITORY/git/ref/tags/$RELEASE_TAG" > release-ref.json
          node --input-type=module <<'EOF'
          import { readFileSync } from "node:fs"
          const state = JSON.parse(readFileSync("release-state.json", "utf8"))
          const ref = JSON.parse(readFileSync("release-ref.json", "utf8"))
          if (state.tagName !== process.env.RELEASE_TAG || state.targetCommitish !== process.env.DESKTOP_SOURCE_SHA || state.isDraft || !state.isPrerelease) throw new Error("Desktop release identity changed")
          if (ref.ref !== `refs/tags/${process.env.RELEASE_TAG}` || ref.object?.type !== "commit" || ref.object.sha !== process.env.DESKTOP_SOURCE_SHA) throw new Error("Desktop release tag changed")
          const required = ["bharatcode-next-beta-cohort.json", "bharatcode-next-beta-cohort.json.sha256", "bharatcode-next-beta-cohort.json.intoto.jsonl"]
          for (const name of required) if (state.assets.filter((item) => item.name === name).length !== 1) throw new Error(`Desktop release asset changed: ${name}`)
          EOF

      - name: Download exact public CLI cohort
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir release-input
          gh release download "$RELEASE_TAG" --repo "$DESKTOP_REPOSITORY" \
            --pattern 'bharatcode-*.tgz' \
            --pattern 'bharatcode-*.tgz.intoto.jsonl' \
            --pattern 'bharatcode-next-beta-cohort.json' \
            --pattern 'bharatcode-next-beta-cohort.json.sha256' \
            --pattern 'bharatcode-next-beta-cohort.json.intoto.jsonl' \
            --dir release-input

      - name: Verify signed cohort, exact tarballs, and closed manifests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          actual="$(sha256sum release-input/bharatcode-next-beta-cohort.json | cut -d ' ' -f1)"
          [[ "$actual" == "$EXPECTED_COHORT_SHA256" ]]
          (cd release-input && sha256sum --check bharatcode-next-beta-cohort.json.sha256)
          gh attestation verify release-input/bharatcode-next-beta-cohort.json \
            --bundle release-input/bharatcode-next-beta-cohort.json.intoto.jsonl \
            --repo "$DESKTOP_REPOSITORY" \
            --signer-workflow "$DESKTOP_REPOSITORY/$DESKTOP_WORKFLOW" \
            --source-digest "$DESKTOP_SOURCE_SHA" \
            --deny-self-hosted-runners > /dev/null
          node scripts/first-class-cohort-release.mjs release-input > verified-cli.json
          while IFS= read -r filename; do
            subject="release-input/$filename"
            gh attestation verify "$subject" \
              --bundle "$subject.intoto.jsonl" \
              --repo "$DESKTOP_REPOSITORY" \
              --signer-workflow "$DESKTOP_REPOSITORY/$DESKTOP_WORKFLOW" \
              --source-digest "$DESKTOP_SOURCE_SHA" \
              --deny-self-hosted-runners > /dev/null
          done < <(node -e 'for (const item of JSON.parse(require("fs").readFileSync("verified-cli.json")).packages) console.log(item.filename)')

      - name: Re-admit exact controller and Desktop release before npm mutation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$CONTROLLER_SHA" ]]
          [[ "$(git ls-remote origin refs/heads/main | cut -f1)" == "$CONTROLLER_SHA" ]]
          gh release view "$RELEASE_TAG" --repo "$DESKTOP_REPOSITORY" --json tagName,targetCommitish,isDraft,isPrerelease,assets > release-current.json
          gh api "repos/$DESKTOP_REPOSITORY/git/ref/tags/$RELEASE_TAG" > release-ref-current.json
          node --input-type=module <<'EOF'
          import { createHash } from "node:crypto"
          import { readFileSync } from "node:fs"
          const state = JSON.parse(readFileSync("release-current.json", "utf8"))
          const ref = JSON.parse(readFileSync("release-ref-current.json", "utf8"))
          if (state.tagName !== process.env.RELEASE_TAG || state.targetCommitish !== process.env.DESKTOP_SOURCE_SHA || state.isDraft || !state.isPrerelease) throw new Error("Desktop release identity changed before npm mutation")
          if (ref.ref !== `refs/tags/${process.env.RELEASE_TAG}` || ref.object?.type !== "commit" || ref.object.sha !== process.env.DESKTOP_SOURCE_SHA) throw new Error("Desktop release tag changed before npm mutation")
          const local = new Map()
          for (const name of JSON.parse(readFileSync("verified-cli.json", "utf8")).packages.flatMap((item) => [item.filename, `${item.filename}.intoto.jsonl`])) local.set(name, readFileSync(`release-input/${name}`))
          for (const name of ["bharatcode-next-beta-cohort.json", "bharatcode-next-beta-cohort.json.sha256", "bharatcode-next-beta-cohort.json.intoto.jsonl"]) local.set(name, readFileSync(`release-input/${name}`))
          for (const [name, bytes] of local) {
            const matches = state.assets.filter((item) => item.name === name)
            const digest = `sha256:${createHash("sha256").update(bytes).digest("hex")}`
            if (matches.length !== 1 || matches[0].size !== bytes.length || matches[0].digest !== digest) throw new Error(`Desktop release asset changed before npm mutation: ${name}`)
          }
          EOF

      - name: Publish missing exact packages to next, platform first and meta last
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$NODE_AUTH_TOKEN"
          mapfile -t PLATFORM_PACKAGE_NAMES < <(node --input-type=module -e 'import { PLATFORM_PACKAGE_NAMES } from "./scripts/first-class-cohort-release.mjs"; for (const name of PLATFORM_PACKAGE_NAMES) console.log(name)')
          publish_or_verify() {
            local name="$1"
            local package="./release-input/$name-$CLI_VERSION.tgz"
            local expected
            expected="$(sha256sum "$package" | cut -d ' ' -f1)"
            if npm view "$name@$CLI_VERSION" version >/dev/null 2>&1; then
              local tarball
              tarball="$(npm view "$name@$CLI_VERSION" dist.tarball)"
              curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 "$tarball" --output registry-existing.tgz
              [[ "$(sha256sum registry-existing.tgz | cut -d ' ' -f1)" == "$expected" ]]
              rm registry-existing.tgz
              return
            fi
            npm publish "$package" --tag next --access public --provenance
          }
          for name in "${PLATFORM_PACKAGE_NAMES[@]}"; do publish_or_verify "$name"; done
          publish_or_verify bharatcode
          for name in "${PLATFORM_PACKAGE_NAMES[@]}" bharatcode; do
            for delay in 0 2 4 8 16 30; do
              [[ "$(npm view "$name@$CLI_VERSION" version 2>/dev/null || true)" == "$CLI_VERSION" ]] && break
              sleep "$delay"
            done
            [[ "$(npm view "$name@$CLI_VERSION" version)" == "$CLI_VERSION" ]]
            npm dist-tag add "$name@$CLI_VERSION" next
          done

      - name: Verify exact registry provenance without publication credentials
        run: |
          set -euo pipefail
          unset NODE_AUTH_TOKEN
          [[ -z "${NODE_AUTH_TOKEN:-}" ]]
          mkdir registry-provenance
          mapfile -t names < <(node -e 'for (const item of JSON.parse(require("fs").readFileSync("verified-cli.json")).packages) console.log(item.name)')
          verify_provenance() {
            local name="$1"
            local root
            root="$(mktemp -d)"
            printf '{"private":true}\n' > "$root/package.json"
            (
              cd "$root"
              npx --yes npm@12.0.2 install --force --ignore-scripts --omit=optional --save-exact --registry=https://registry.npmjs.org "$name@$CLI_VERSION" > /dev/null
              npx --yes npm@12.0.2 audit signatures --json --include-attestations > audit.json
            )
          CONTROLLER_SHA="$PACKAGE_PROVENANCE_SHA" node scripts/first-class-cohort-release.mjs verify-npm-provenance "$root/audit.json" "$name" > "registry-provenance/$name.json"
            rm -rf "$root"
          }
          for name in "${names[@]}"; do verify_provenance "$name"; done

      - name: Verify registry closure and create next receipt
        id: receipt
        run: |
          set -euo pipefail
          node --input-type=module <<'EOF'
          import { canonicalJson } from "./scripts/first-class-cohort-release.mjs"
          import { createHash } from "node:crypto"
          import { readdirSync, readFileSync, writeFileSync } from "node:fs"
          const verified = JSON.parse(readFileSync("verified-cli.json", "utf8"))
          const registry_provenance = verified.packages.map((item) => JSON.parse(readFileSync(`registry-provenance/${item.name}.json`, "utf8")))
          const release_assets = readdirSync("release-input").sort().map((filename) => { const bytes = readFileSync(`release-input/${filename}`); return { filename, bytes: bytes.length, sha256: createHash("sha256").update(bytes).digest("hex") } })
          const value = { schema: "bharatcode-first-class-cli-next-v2", repository: "BharatCode-ai/bharatcode-cli", controller_sha: process.env.CONTROLLER_SHA, desktop_repository: process.env.DESKTOP_REPOSITORY, desktop_source_sha: process.env.DESKTOP_SOURCE_SHA, desktop_run_id: process.env.DESKTOP_RUN_ID, desktop_run_attempt: process.env.DESKTOP_RUN_ATTEMPT, release_tag: process.env.RELEASE_TAG, cohort_sha256: verified.cohort_sha256, cli_version: process.env.CLI_VERSION, packages: verified.packages, registry_provenance, release_assets, github: { run_id: process.env.GITHUB_RUN_ID, run_attempt: process.env.GITHUB_RUN_ATTEMPT }, completed_at: new Date().toISOString() }
          const bytes = canonicalJson(value)
          writeFileSync("bharatcode-first-class-cli-next.json", bytes, { mode: 0o600 })
          writeFileSync("bharatcode-first-class-cli-next.json.sha256", `${createHash("sha256").update(bytes).digest("hex")}  bharatcode-first-class-cli-next.json\n`, { mode: 0o600 })
          EOF
          mapfile -t packages < <(node -e 'for (const item of JSON.parse(require("fs").readFileSync("verified-cli.json")).packages) console.log(`${item.name} ${item.sha256}`)')
          for entry in "${packages[@]}"; do
            name="${entry%% *}"
            expected="${entry##* }"
            [[ "$(npm view "$name@$CLI_VERSION" version)" == "$CLI_VERSION" ]]
            [[ "$(npm view "$name" dist-tags.next)" == "$CLI_VERSION" ]]
            tarball="$(npm view "$name@$CLI_VERSION" dist.tarball)"
            curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 "$tarball" --output registry.tgz
            [[ "$(sha256sum registry.tgz | cut -d ' ' -f1)" == "$expected" ]]
          done
          printf 'sha256=%s\n' "$(cut -d ' ' -f1 bharatcode-first-class-cli-next.json.sha256)" >> "$GITHUB_OUTPUT"

      - name: Attest exact next receipt
        id: attest_receipt
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: bharatcode-first-class-cli-next.json

      - name: Stage next receipt provenance
        env:
          BUNDLE_PATH: ${{ steps.attest_receipt.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" bharatcode-first-class-cli-next.json.intoto.jsonl

      - name: Upload exact next receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bharatcode-first-class-cli-next-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          overwrite: false
          path: |
            bharatcode-first-class-cli-next.json
            bharatcode-first-class-cli-next.json.sha256
            bharatcode-first-class-cli-next.json.intoto.jsonl

  promote-latest:
    name: Smoke exact next cohort and promote latest
    needs: publish-next
    runs-on: ubuntu-24.04
    environment: npm-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out exact controller
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ inputs.controller_sha }}

      - name: Set up Node.js and registry auth
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: Set up Bun install smoke runtime
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Refuse partial same-run reruns
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          [[ "$RUN_ATTEMPT" == "1" ]] || { printf '%s\n' "Start a fresh controller dispatch after an incomplete latest promotion." >&2; exit 1; }

      - name: Download and bind same-run next receipt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bharatcode-first-class-cli-next-${{ github.run_id }}-${{ github.run_attempt }}
          digest-mismatch: error

      - name: Re-admit exact controller and Desktop release before latest mutation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$CONTROLLER_SHA" ]]
          [[ "$(git ls-remote origin refs/heads/main | cut -f1)" == "$CONTROLLER_SHA" ]]
          gh release view "$RELEASE_TAG" --repo "$DESKTOP_REPOSITORY" --json tagName,targetCommitish,isDraft,isPrerelease,assets > release-current.json
          gh api "repos/$DESKTOP_REPOSITORY/git/ref/tags/$RELEASE_TAG" > release-ref-current.json
          node --input-type=module <<'EOF'
          import { readFileSync } from "node:fs"
          const state = JSON.parse(readFileSync("release-current.json", "utf8"))
          const ref = JSON.parse(readFileSync("release-ref-current.json", "utf8"))
          if (state.tagName !== process.env.RELEASE_TAG || state.targetCommitish !== process.env.DESKTOP_SOURCE_SHA || state.isDraft || !state.isPrerelease) throw new Error("Desktop release identity changed before latest mutation")
          if (ref.ref !== `refs/tags/${process.env.RELEASE_TAG}` || ref.object?.type !== "commit" || ref.object.sha !== process.env.DESKTOP_SOURCE_SHA) throw new Error("Desktop release tag changed before latest mutation")
          const next = JSON.parse(readFileSync("bharatcode-first-class-cli-next.json", "utf8"))
          if (!Array.isArray(next.release_assets) || next.release_assets.length !== 29) throw new Error("Desktop release asset receipt changed")
          for (const expected of next.release_assets) {
            const matches = state.assets.filter((item) => item.name === expected.filename)
            if (matches.length !== 1 || matches[0].size !== expected.bytes || matches[0].digest !== `sha256:${expected.sha256}`) throw new Error(`Desktop release asset changed before latest mutation: ${expected.filename}`)
          }
          EOF
          gh attestation verify bharatcode-first-class-cli-next.json \
            --bundle bharatcode-first-class-cli-next.json.intoto.jsonl \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/npm-release.yml" \
            --source-digest "$CONTROLLER_SHA" \
            --deny-self-hosted-runners > /dev/null

      - name: Verify every next package and installed host runtime
        run: |
          set -euo pipefail
          sha256sum --check bharatcode-first-class-cli-next.json.sha256
          [[ "$(cut -d ' ' -f1 bharatcode-first-class-cli-next.json.sha256)" == "${{ needs.publish-next.outputs.receipt_sha256 }}" ]]
          mapfile -t packages < <(node -e 'for (const item of JSON.parse(require("fs").readFileSync("bharatcode-first-class-cli-next.json")).packages) console.log(`${item.name} ${item.sha256}`)')
          for entry in "${packages[@]}"; do
            name="${entry%% *}"
            expected="${entry##* }"
            [[ "$(npm view "$name" dist-tags.next)" == "$CLI_VERSION" ]]
            tarball="$(npm view "$name@$CLI_VERSION" dist.tarball)"
            curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 "$tarball" --output registry.tgz
            [[ "$(sha256sum registry.tgz | cut -d ' ' -f1)" == "$expected" ]]
          done
          smoke_root="$(mktemp -d)"
          trap 'rm -rf "$smoke_root"' EXIT
          for npm_major in 11 12; do
            npx --yes "npm@$npm_major" install --prefix "$smoke_root/npm-$npm_major" --no-save --registry=https://registry.npmjs.org "bharatcode@$CLI_VERSION"
            [[ "$("$smoke_root/npm-$npm_major/node_modules/.bin/bharatcode" --version)" == "$CLI_VERSION" ]]
          done
          mkdir "$smoke_root/bun"
          printf '{"private":true}\n' > "$smoke_root/bun/package.json"
          bun add --cwd "$smoke_root/bun" --registry=https://registry.npmjs.org "bharatcode@$CLI_VERSION"
          [[ "$("$smoke_root/bun/node_modules/.bin/bharatcode" --version)" == "$CLI_VERSION" ]]
          node --input-type=module - "$smoke_root/npm-12/node_modules/bharatcode/package.json" <<'EOF'
          import { readFileSync } from "node:fs"
          const pkg = JSON.parse(readFileSync(process.argv[2], "utf8"))
          if (pkg.name !== "bharatcode" || pkg.version !== process.env.CLI_VERSION || pkg.dependencies || pkg.peerDependencies) throw new Error("Installed CLI is not the first-class cohort")
          if (!pkg.optionalDependencies || Object.keys(pkg.optionalDependencies).length !== 12 || Object.values(pkg.optionalDependencies).some((value) => value !== process.env.CLI_VERSION)) throw new Error("Installed CLI platform closure changed")
          EOF

      - name: Re-admit exact controller and Desktop release immediately before latest mutation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$CONTROLLER_SHA" ]]
          [[ "$(git ls-remote origin refs/heads/main | cut -f1)" == "$CONTROLLER_SHA" ]]
          gh release view "$RELEASE_TAG" --repo "$DESKTOP_REPOSITORY" --json tagName,targetCommitish,isDraft,isPrerelease,assets > release-final.json
          gh api "repos/$DESKTOP_REPOSITORY/git/ref/tags/$RELEASE_TAG" > release-ref-final.json
          node --input-type=module <<'EOF'
          import { readFileSync } from "node:fs"
          const state = JSON.parse(readFileSync("release-final.json", "utf8"))
          const ref = JSON.parse(readFileSync("release-ref-final.json", "utf8"))
          if (state.tagName !== process.env.RELEASE_TAG || state.targetCommitish !== process.env.DESKTOP_SOURCE_SHA || state.isDraft || !state.isPrerelease) throw new Error("Desktop release identity changed immediately before latest mutation")
          if (ref.ref !== `refs/tags/${process.env.RELEASE_TAG}` || ref.object?.type !== "commit" || ref.object.sha !== process.env.DESKTOP_SOURCE_SHA) throw new Error("Desktop release tag changed immediately before latest mutation")
          const next = JSON.parse(readFileSync("bharatcode-first-class-cli-next.json", "utf8"))
          if (!Array.isArray(next.release_assets) || next.release_assets.length !== 29) throw new Error("Desktop release asset receipt changed")
          for (const expected of next.release_assets) {
            const matches = state.assets.filter((item) => item.name === expected.filename)
            if (matches.length !== 1 || matches[0].size !== expected.bytes || matches[0].digest !== `sha256:${expected.sha256}`) throw new Error(`Desktop release asset changed immediately before latest mutation: ${expected.filename}`)
          }
          EOF
          gh attestation verify bharatcode-first-class-cli-next.json \
            --bundle bharatcode-first-class-cli-next.json.intoto.jsonl \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/npm-release.yml" \
            --source-digest "$CONTROLLER_SHA" \
            --deny-self-hosted-runners > /dev/null

      - name: Promote the complete exact cohort to latest, meta last
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$NODE_AUTH_TOKEN"
          mapfile -t PLATFORM_PACKAGE_NAMES < <(node --input-type=module -e 'import { PLATFORM_PACKAGE_NAMES } from "./scripts/first-class-cohort-release.mjs"; for (const name of PLATFORM_PACKAGE_NAMES) console.log(name)')
          verify_latest() {
            local name="$1"
            local delay
            for delay in 0 2 4 8 16 30; do
              [[ "$delay" == 0 ]] || sleep "$delay"
              [[ "$(npm view "$name" dist-tags.latest --prefer-online 2>/dev/null || true)" == "$CLI_VERSION" ]] && return 0
            done
            printf 'Registry latest verification did not converge: %s\n' "$name" >&2
            return 1
          }
          promote_or_verify() {
            local name="$1"
            local current
            current="$(npm view "$name" dist-tags.latest 2>/dev/null || true)"
            [[ "$current" == "$CLI_VERSION" ]] || npm dist-tag add "$name@$CLI_VERSION" latest
            verify_latest "$name"
          }
          for name in "${PLATFORM_PACKAGE_NAMES[@]}"; do promote_or_verify "$name"; done
          promote_or_verify bharatcode
          for name in "${PLATFORM_PACKAGE_NAMES[@]}" bharatcode; do
            verify_latest "$name"
          done

      - name: Create exact latest completion receipt
        id: latest_receipt
        run: |
          set -euo pipefail
          node --input-type=module <<'EOF'
          import { canonicalJson } from "./scripts/first-class-cohort-release.mjs"
          import { createHash } from "node:crypto"
          import { readFileSync, writeFileSync } from "node:fs"
          const next = JSON.parse(readFileSync("bharatcode-first-class-cli-next.json", "utf8"))
          const next_receipt_sha256 = createHash("sha256").update(readFileSync("bharatcode-first-class-cli-next.json")).digest("hex")
          const value = { schema: "bharatcode-first-class-cli-latest-v1", repository: "BharatCode-ai/bharatcode-cli", controller_sha: process.env.CONTROLLER_SHA, desktop_source_sha: process.env.DESKTOP_SOURCE_SHA, release_tag: process.env.RELEASE_TAG, cohort_sha256: process.env.EXPECTED_COHORT_SHA256, cli_version: process.env.CLI_VERSION, next_receipt_sha256, packages: next.packages.map((item) => ({ name: item.name, version: process.env.CLI_VERSION, sha256: item.sha256, latest: process.env.CLI_VERSION })), github: { run_id: process.env.GITHUB_RUN_ID, run_attempt: process.env.GITHUB_RUN_ATTEMPT }, completed_at: new Date().toISOString() }
          const bytes = canonicalJson(value)
          writeFileSync("bharatcode-first-class-cli-latest.json", bytes, { mode: 0o600 })
          writeFileSync("bharatcode-first-class-cli-latest.json.sha256", `${createHash("sha256").update(bytes).digest("hex")}  bharatcode-first-class-cli-latest.json\n`, { mode: 0o600 })
          EOF
          sha256sum --check bharatcode-first-class-cli-latest.json.sha256
          printf 'sha256=%s\n' "$(cut -d ' ' -f1 bharatcode-first-class-cli-latest.json.sha256)" >> "$GITHUB_OUTPUT"

      - name: Attest exact latest completion receipt
        id: attest_latest_receipt
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: bharatcode-first-class-cli-latest.json

      - name: Stage latest receipt provenance
        env:
          BUNDLE_PATH: ${{ steps.attest_latest_receipt.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" bharatcode-first-class-cli-latest.json.intoto.jsonl

      - name: Upload exact latest completion receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bharatcode-first-class-cli-latest-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          overwrite: false
          path: |
            bharatcode-first-class-cli-latest.json
            bharatcode-first-class-cli-latest.json.sha256
            bharatcode-first-class-cli-latest.json.intoto.jsonl
